name: D_htft_mgtr_wave_mean
description: 'Strategy D: wave_mean of A_htdemucs6s_ft, A_mega_guitar'
steps:
- id: m0_guitar
  model: htdemucs6s_gtrft
  input: mix
  params:
    num_overlap: 2
    precision: bf16
- id: m1_guitar
  model: mega_multi
  input: mix
  take: guitar
  params:
    num_overlap: 2
    precision: bf16
- id: ens
  ensemble:
  - m0_guitar
  - m1_guitar
  method: wave_mean
output: ens

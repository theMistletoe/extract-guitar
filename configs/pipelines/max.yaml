name: max
description: '[preset max] Champion exp030_R_r3 (val SDR 4.68 dB), fp32 | Phase 7-9
  gain refiner (r3): learns a 0..2 time-frequency gain on the Champion ensemble (HTDemucs-ft
  + Mega acoustic waveform mean), with SW guitar + Mega guitar as extra positive evidence
  and SW other/piano/vocals/bass/drums + Mega violin/woodwind/electric as negative
  evidence; hard-example-mined sampling'
steps:
- id: ht
  model: htdemucs6s_gtrft
  input: mix
  params:
    num_overlap: 2
    precision: fp32
- id: mm
  model: mega_multi
  input: mix
  params:
    num_overlap: 2
    precision: fp32
- id: sw
  model: sw6
  input: mix
  params:
    num_overlap: 2
    precision: fp32
- id: ref
  refiner: artifacts/refiner/r3/model.pt
  positives:
  - ht.guitar
  - mm.acoustic-guitar
  - sw.guitar
  - mm.guitar
  negatives:
  - sw.other
  - sw.piano
  - sw.vocals
  - sw.bass
  - sw.drums
  - mm.violin
  - mm.woodwind
  - mm.electric-guitar
output: ref

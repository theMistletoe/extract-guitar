    num_overlap: 2
    precision: fp32
- id: m1_guitar
  model: mega_multi
  input: mix
  take: acoustic-guitar
  params:
    num_overlap: 2
    precision: fp32
- id: ens
  ensemble:
  - m0_guitar
  - m1_guitar
  method: wave_mean
output: ens

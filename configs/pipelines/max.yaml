name: max
description: '[preset max] Champion exp023_D_htft_macou_wave_mean (val SDR 4.16 dB),
  fp32 | Strategy D: wave_mean of A_htdemucs6s_ft, A_mega_acoustic'
steps:
- id: m0_guitar
  model: htdemucs6s_gtrft
  input: mix

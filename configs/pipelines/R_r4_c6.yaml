name: R_r4_c6
description: "Phase 9 gain refiner (r4), every member computed with 6 s chunks exactly as in training, on the improved 3-member ensemble: SW guitar minus Mega electric estimate (Strategy B output) + HTDemucs-ft + Mega acoustic; SW guitar and Mega guitar as extra positives; SW other/piano/vocals/bass/drums + Mega violin/woodwind/electric as negative evidence"
steps:
  - {id: g, model: xlance_gtr, input: mix, params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - {id: swme, model: mega_multi, input: g, take: "~electric-guitar", params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - {id: ht, model: htdemucs6s_gtrft, input: mix, params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - {id: mm, model: mega_multi, input: mix, params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - {id: sw, model: sw6, input: mix, params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - id: ref
    refiner: artifacts/refiner/r4/model.pt
    positives: [swme, ht.guitar, mm.acoustic-guitar, sw.guitar, mm.guitar]
    negatives: [sw.other, sw.piano, sw.vocals, sw.bass, sw.drums, mm.violin, mm.woodwind, mm.electric-guitar]
output: ref

name: A_mega_acoustic
description: "Strategy A (direct): MVSep Mega-53 acoustic-guitar head applied to the full mix (computed with the merged mega_multi model; identical output to the single-head checkpoint)"
steps:
  - id: guitar
    model: mega_multi
    input: mix
    take: acoustic-guitar
    params: {num_overlap: 2, precision: bf16}
output: guitar

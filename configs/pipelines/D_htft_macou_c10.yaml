description: 'Chunk-size sweep: waveform mean of HTDemucs-ft + Mega acoustic, both
  members at 10 s chunks (no refiner)'
name: D_htft_macou_c10
output: ens
steps:
- id: m0_guitar
  input: mix
  model: htdemucs6s_gtrft
  params:
    chunk_size: 441000
    num_overlap: 2
    precision: bf16
- id: m1_guitar
  input: mix
  model: mega_multi
  params:
    chunk_size: 441000
    num_overlap: 2
    precision: bf16
  take: acoustic-guitar
- ensemble:
  - m0_guitar
  - m1_guitar
  id: ens
  method: wave_mean

name: C_xlance_then_violin_clarinet
description: "Strategy C (post-cascade): X-LANCE guitar stem, then remove residual violin and clarinet leakage with Mega heads"
steps:
  - {id: g, model: xlance_gtr, input: mix, params: {num_overlap: 2, precision: bf16}}
  - {id: g2, model: mega_violin, input: g, take: "~violin", params: {num_overlap: 2, precision: bf16}}
  - {id: g3, model: mega_clarinet, input: g2, take: "~clarinet", params: {num_overlap: 2, precision: bf16}}
output: g3

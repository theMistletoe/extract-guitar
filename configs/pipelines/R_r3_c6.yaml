name: R_r3_c6
description: "Phase 7-9 gain refiner (r3) with every member computed with 6 s chunks exactly as in training: learns a 0..2 time-frequency gain on the Champion ensemble (HTDemucs-ft + Mega acoustic waveform mean), with SW guitar + Mega guitar as extra positive evidence and SW other/piano/vocals/bass/drums + Mega violin/woodwind/electric as negative evidence; hard-example-mined sampling"
steps:
  - {id: ht, model: htdemucs6s_gtrft, input: mix, params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - {id: mm, model: mega_multi, input: mix, params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - {id: sw, model: sw6, input: mix, params: {num_overlap: 2, precision: bf16, chunk_size: 264600}}
  - id: ref
    refiner: artifacts/refiner/r3/model.pt
    positives: [ht.guitar, mm.acoustic-guitar, sw.guitar, mm.guitar]
    negatives: [sw.other, sw.piano, sw.vocals, sw.bass, sw.drums, mm.violin, mm.woodwind, mm.electric-guitar]
output: ref

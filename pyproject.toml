[project]
name = "acoustic-separator"
version = "0.1.0"
description = "High-accuracy acoustic guitar stem extraction from full stereo music mixes"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "soxr>=0.3",
    "imageio-ffmpeg>=0.5",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "ml-collections>=0.1",
    "einops>=0.7",
    "rotary-embedding-torch>=0.6",
    "beartype>=0.18",
    "huggingface-hub>=0.24",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "librosa>=0.10",
    "packaging>=23",
    "yt-dlp>=2025.1.1",
    "torch>=2.3",
    "demucs>=4.0.1",
    "transformers>=4.44",
    "fast-bss-eval>=0.1.4",
]

[project.optional-dependencies]
# Pick exactly one of these to choose the PyTorch build:
#   uv sync --extra cpu      (Linux/Windows CPU, macOS incl. MPS)
#   uv sync --extra cu126    (NVIDIA CUDA 12.6)
cpu = ["torch>=2.3"]
cu126 = ["torch>=2.3"]
dev = ["pytest>=8"]
# Guitar tablature (scripts/*tab*.py): Guitar Pro export, engraved PDF, benchmark scoring
tab = ["safetensors>=0.4", "pyguitarpro>=0.9", "lilypond>=2.24", "mir_eval>=0.7", "mido>=1.3"]

[project.scripts]
acoustic-separator = "acoustic_separator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoustic_separator"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

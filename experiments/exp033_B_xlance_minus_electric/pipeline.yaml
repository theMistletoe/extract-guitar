name: B_xlance_minus_electric
description: 'Strategy B (two-stage): SW/X-LANCE all-guitar stem, then subtract the
  Mega-53 electric-guitar estimate of that stem'
steps:
- id: g
  model: xlance_gtr
  input: mix
  params:
    num_overlap: 2
    precision: bf16
- id: ag
  model: mega_multi
  input: g
  take: ~electric-guitar
  params:
    num_overlap: 2
    precision: bf16
output: ag

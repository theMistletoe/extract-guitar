name: W_htft_macou__weights0.4-0.6
description: 'Strategy D: wave_mean of A_htdemucs6s_ft, A_mega_acoustic | sweep {''ens.weights'':
  [0.4, 0.6]}'
steps:
- id: m0_guitar
  model: htdemucs6s_gtrft
  input: mix
  params:
    num_overlap: 2
    precision: bf16
- id: m1_guitar
  model: mega_multi
  input: mix
  take: acoustic-guitar
  params:
    num_overlap: 2
    precision: bf16
- id: ens
  ensemble:
  - m0_guitar
  - m1_guitar
  method: wave_mean
  weights:
  - 0.4
  - 0.6
output: ens

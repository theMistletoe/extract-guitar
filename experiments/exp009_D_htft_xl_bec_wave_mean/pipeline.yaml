name: D_htft_xl_bec_wave_mean
description: 'Strategy D: wave_mean of A_htdemucs6s_ft, A_xlance, A_becruily'
steps:
- id: m0_guitar
  model: htdemucs6s_gtrft
  input: mix
  params:
    num_overlap: 2
    precision: bf16
- id: m1_guitar
  model: xlance_gtr
  input: mix
  params:
    num_overlap: 2
    precision: bf16
- id: m2_guitar
  model: becruily_guitar
  input: mix
  params:
    num_overlap: 2
    precision: bf16
- id: ens
  ensemble:
  - m0_guitar
  - m1_guitar
  - m2_guitar
  method: wave_mean
output: ens

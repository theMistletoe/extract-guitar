experiment: exp054_R_r5_m4_aac128_real19
strategy: codec robustness
pipeline:
  name: R_r5_m4
  description: 'Phase 9 gain refiner (r5): r4 members/evidence, HTDemucs at native
    chunk, Mega on the mix at 4 s, SW and the SW->Mega cascade at 6 s (all exactly
    as in training)'
  steps:
  - id: g
    model: xlance_gtr
    input: mix
    params:
      num_overlap: 2
      precision: bf16
      chunk_size: 264600
  - id: swme
    model: mega_multi
    input: g
    take: ~electric-guitar
    params:
      num_overlap: 2
      precision: bf16
      chunk_size: 264600
  - id: ht
    model: htdemucs6s_gtrft
    input: mix
    params:
      num_overlap: 2
      precision: bf16
  - id: mm
    model: mega_multi
    input: mix
    params:
      num_overlap: 2
      precision: bf16
      chunk_size: 176400
  - id: sw
    model: sw6
    input: mix
    params:
      num_overlap: 2
      precision: bf16
      chunk_size: 264600
  - id: ref
    refiner: artifacts/refiner/r5/model.pt
    positives:
    - swme
    - ht.guitar
    - mm.acoustic-guitar
    - sw.guitar
    - mm.guitar
    negatives:
    - sw.other
    - sw.piano
    - sw.vocals
    - sw.bass
    - sw.drums
    - mm.violin
    - mm.woodwind
    - mm.electric-guitar
  output: ref

reproducibility:
  git_commit: 8fbffe8d2617bb988ef67f502b17cfe57fe72bad
  command: scripts/benchmark.py --pipeline R_r5_m4 --slug R_r5_m4_aac128_real19 --strategy
    codec robustness --val-dir datasets/validation_aac --val-limit 19 --no-target
    --no-champion --hypothesis The target is AAC with a 16 kHz low-pass; the Champion's
    validation score is on lossless mixtures. Scoring it on the 19 real-multitrack
    clips passed through AAC 128k (clean references) measures how much codec damage
    costs. --change exp050 pipeline on datasets/validation_aac, first 19 clips (=
    all real multitracks); mixtures AAC-128k, references clean --next report the codec
    penalty in the final report
